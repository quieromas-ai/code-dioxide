[project]
name = "code-dioxide"
version = "0.1.0"
description = "MCP server that runs delegated work as headless Claude Code workflow sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "ai", "agents", "claude", "claude-code", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "PyYAML>=6.0",
    "click>=8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/quieromas-ai/code-dioxide"
Repository = "https://github.com/quieromas-ai/code-dioxide"
Issues = "https://github.com/quieromas-ai/code-dioxide/issues"

[project.scripts]
dioxide = "cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "cli"]

[tool.hatch.build.targets.wheel.force-include]
"workflows" = "src/workflows"
"templates" = "cli/templates"
"examples" = "cli/examples"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: talks to a real Claude Code binary; excluded by default (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
ignore_missing_imports = true
